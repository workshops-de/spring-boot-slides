name: Template Sync

on:
  # Run manually via workflow dispatch
  workflow_dispatch:

  # Run on a schedule (every Monday at 3 AM UTC)
  schedule:
    - cron: '0 3 * * 1'

  # Run when template repository is updated (requires webhook setup)
  repository_dispatch:
    types: [template-sync]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run template sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          # Source template repository (SSH format)
          source_repo_path: git@github.com:workshops-de/workshop-slides-template.git

          # Use HTTPS if you don't have SSH deploy keys configured
          # source_repo_path: https://github.com/workshops-de/workshop-slides-template.git

          # Branch to sync from (default is main)
          upstream_branch: main

          # Target branch in this repository
          pr_branch_name_prefix: template-sync-

          # Pull request settings
          pr_title: "chore: sync with template repository"
          pr_labels: template-sync,automated
          pr_commit_msg: "chore: sync with template"

          # SSH key for private template repositories
          # Uncomment if using SSH and template is private
          # ssh_private_key: ${{ secrets.TEMPLATE_SYNC_SSH_KEY }}

          # GitHub token for creating PRs
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Ignore file path
          pr_ignore_file: .templatesyncignore

