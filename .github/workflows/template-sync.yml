name: Template Sync

on:
  # Run manually via workflow dispatch
  workflow_dispatch:

  # Run on a schedule (every Monday at 3 AM UTC)
  schedule:
    - cron: '0 3 * * 1'

  # Run when template repository is updated (requires webhook setup)
  repository_dispatch:
    types: [template-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run template sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          # Source template repository (owner/repo format works for both public and private repos)
          source_repo_path: workshops-de/workshop-slides-template

          # For private repos, add SSH key:
          # source_repo_ssh_private_key: ${{ secrets.TEMPLATE_SYNC_SSH_KEY }}

          # Branch to sync from (default is main)
          upstream_branch: main

          # Target branch in this repository
          pr_branch_name_prefix: template-sync-

          # Pull request settings
          pr_title: 'chore: sync with template repository'
          pr_labels: template-sync,automated
          pr_commit_msg: 'chore: sync with template'

          # GitHub token for creating PRs (updated parameter name)
          source_gh_token: ${{ secrets.GITHUB_TOKEN }}

          # Ignore file path (updated parameter name)
          template_sync_ignore_file_path: .templatesyncignore
