name: Template Sync

on:
  # Run manually via workflow dispatch
  workflow_dispatch:

  # Run on a schedule (every Monday at 3 AM UTC)
  schedule:
    - cron: '0 3 * * 1'

  # Run when template repository is updated (requires webhook setup)
  repository_dispatch:
    types: [template-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run template sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          # Source template repository (owner/repo format)
          source_repo_path: workshops-de/workshop-slides-template

          # Branch to sync from
          upstream_branch: main

          # Target branch in this repository
          pr_branch_name_prefix: template-sync-

          # Pull request settings
          pr_title: 'chore: sync with template repository'
          pr_labels: template-sync,automated
          pr_commit_msg: 'chore: sync with template'

          # Ignore file path
          template_sync_ignore_file_path: .templatesyncignore
